name: Terraform dev
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Comando Terraform (dev)"
        required: true
        default: plan
        type: choice
        options: [init, validate, plan, apply, destroy]
permissions:
  contents: read
  id-token: write
jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: environments/dev
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false -no-color > /dev/null 2>&1
      - name: Terraform ${{ inputs.command }}
        run: |
          set -o pipefail
          az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" --output none
          SQL_LOGIN=$(az keyvault secret show --vault-name kv-ai-agent-dev-we-01 --name sql-admin-login --query value -o tsv)
          SQL_PASSWORD=$(az keyvault secret show --vault-name kv-ai-agent-dev-we-01 --name sql-admin-password --query value -o tsv)
          echo "::add-mask::$SQL_LOGIN"
          echo "::add-mask::$SQL_PASSWORD"
          terraform ${{ inputs.command }} -input=false -no-color -compact-warnings \
            -var="sql_admin_login=$SQL_LOGIN" \
            -var="sql_admin_password=$SQL_PASSWORD" \
            ${{ (inputs.command == 'apply' || inputs.command == 'destroy') && '-auto-approve' || '' }} > /tmp/tf.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "===== TERRAFORM ERROR ====="
            grep -A 40 "Error:" /tmp/tf.log || tail -80 /tmp/tf.log
          fi
          exit $rc
