name: Terraform dev
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Comando Terraform (dev)"
        required: true
        default: plan
        type: choice
        options: [init, validate, plan, apply, destroy]
permissions:
  contents: read
  id-token: write
jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: environments/dev
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false -no-color > /dev/null 2>&1
      - name: Terraform ${{ inputs.command }}
        run: |
          set +e
          az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" --output none
          SQL_LOGIN=$(az keyvault secret show --vault-name kv-ai-agent-dev-we-01 --name sql-admin-login --query value -o tsv)
          SQL_PASSWORD=$(az keyvault secret show --vault-name kv-ai-agent-dev-we-01 --name sql-admin-password --query value -o tsv)
          echo "::add-mask::$SQL_LOGIN"
          echo "::add-mask::$SQL_PASSWORD"
          TFVARS="-var=sql_admin_login=$SQL_LOGIN -var=sql_admin_password=$SQL_PASSWORD"
          if [ "${{ inputs.command }}" = "apply" ]; then
            echo "===== STEP 1: apply -target=module.virtual_network ====="
            terraform apply -input=false -no-color -compact-warnings -auto-approve $TFVARS -target=module.virtual_network > /tmp/tf1.log 2>&1
            rc1=$?
            if [ $rc1 -ne 0 ]; then
              echo "===== TERRAFORM ERROR (step 1) ====="
              grep -A 40 "Error:" /tmp/tf1.log || tail -80 /tmp/tf1.log
              exit $rc1
            fi
            echo "===== STEP 2: apply (full) ====="
            terraform apply -input=false -no-color -compact-warnings -auto-approve $TFVARS > /tmp/tf2.log 2>&1
            rc2=$?
            if [ $rc2 -ne 0 ]; then
              echo "===== TERRAFORM ERROR (step 2) ====="
              grep -A 40 "Error:" /tmp/tf2.log || tail -80 /tmp/tf2.log
              exit $rc2
            fi
            exit 0
          else
            terraform ${{ inputs.command }} -input=false -no-color -compact-warnings $TFVARS > /tmp/tf.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "===== TERRAFORM ERROR ====="
              grep -A 40 "Error:" /tmp/tf.log || tail -80 /tmp/tf.log
            fi
            exit $rc
          fi
