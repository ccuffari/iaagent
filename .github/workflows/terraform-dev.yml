name: Terraform dev
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Comando Terraform (dev)"
        required: true
        default: plan
        type: choice
        options: [init, validate, plan, apply, destroy]
permissions:
  contents: read
  id-token: write
jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: environments/dev
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_sql_admin_login: ${{ secrets.SQL_ADMIN_LOGIN }}
      TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: terraform init -input=false -no-color
      - name: Terraform ${{ inputs.command }}
        run: |
          set +e
          CMD="${{ inputs.command }}"
          EXTRA=""
          if [ "$CMD" = "apply" ] || [ "$CMD" = "destroy" ]; then
            EXTRA="-auto-approve"
          fi
          terraform $CMD -input=false -no-color -compact-warnings $EXTRA > /tmp/tf.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "===== TERRAFORM ERROR ====="
            grep -A 40 "Error:" /tmp/tf.log || tail -80 /tmp/tf.log
          fi
          exit $rc
