name: Terraform dev apply
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Comando Terraform (dev)"
        required: true
        default: plan
        type: choice
        options: [init, validate, plan, apply, destroy, state-list]
permissions:
  contents: read
  id-token: write
jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: environments/dev
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_sql_admin_login: ${{ secrets.SQL_ADMIN_LOGIN }}
      TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
      TF_LOG: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: |
          echo "::group::terraform init"
          terraform init -input=false -no-color
          echo "::endgroup::"
      - name: Terraform state list (sola lettura)
        if: ${{ inputs.command == 'state-list' || inputs.command == 'plan' }}
        run: |
          echo "::group::terraform state list"
          terraform state list -no-color 2>&1 || echo "(state list fallito)"
          echo "::endgroup::"
      - name: Riconcilia state diagnostic settings (rm vecchi + import nuovi)
        if: ${{ inputs.command == 'apply' }}
        run: |
          set +e
          RG="rg-ai-dev-we-01"
          SUB="$ARM_SUBSCRIPTION_ID"
          BASE="/subscriptions/$SUB/resourceGroups/$RG/providers"

          OLD_ADDRS="
            azurerm_monitor_diagnostic_setting.storage_blob
            azurerm_monitor_diagnostic_setting.sql_database
            azurerm_monitor_diagnostic_setting.storage_account
            azurerm_monitor_diagnostic_setting.adf
            azurerm_monitor_diagnostic_setting.key_vault
            azurerm_monitor_diagnostic_setting.sql_server
          "
          for ADDR in $OLD_ADDRS; do
            echo "::group::state rm $ADDR"
            terraform state rm -lock=false "$ADDR" 2>&1 || echo "(non presente: $ADDR)"
            echo "::endgroup::"
          done

          IMPORTS="
            module.diag_adf.azurerm_monitor_diagnostic_setting.this|$BASE/Microsoft.DataFactory/factories/adf-ai-dev-we-01|diag-adf
            module.diag_sql_server.azurerm_monitor_diagnostic_setting.this|$BASE/Microsoft.Sql/servers/sql-ai-dev-we-01|diag-sqlserver
            module.diag_key_vault.azurerm_monitor_diagnostic_setting.this|$BASE/Microsoft.KeyVault/vaults/kv-ai-agent-dev-we-01|diag-keyvault
            module.diag_storage_account.azurerm_monitor_diagnostic_setting.this|$BASE/Microsoft.Storage/storageAccounts/saaidevwe01|diag-storage-account
            module.diag_storage_blob.azurerm_monitor_diagnostic_setting.this|$BASE/Microsoft.Storage/storageAccounts/saaidevwe01/blobServices/default|diag-storage-blob
            module.diag_sql_database.azurerm_monitor_diagnostic_setting.this|$BASE/Microsoft.Sql/servers/sql-ai-dev-we-01/databases/sql-db-ai-dev-we-01|diag-sqldb
          "
          echo "$IMPORTS" | while IFS='|' read -r ADDR ID; do
            [ -z "$ADDR" ] && continue
            echo "::group::import $ADDR"
            terraform import -input=false -no-color -lock=false "$ADDR" "$ID" 2>&1 || echo "(import saltato: gia' nello state o non presente)"
            echo "::endgroup::"
          done
          exit 0
      - name: Terraform ${{ inputs.command }}
        if: ${{ inputs.command != 'state-list' }}
        run: |
          set +e
          CMD="${{ inputs.command }}"
          EXTRA=""
          if [ "$CMD" = "apply" ] || [ "$CMD" = "destroy" ]; then
            EXTRA="-auto-approve"
          fi
          echo "::group::terraform $CMD (lock=false)"
          echo "Comando: terraform $CMD -input=false -no-color -compact-warnings -lock=false $EXTRA"
          terraform $CMD -input=false -no-color -compact-warnings -lock=false $EXTRA 2>&1 | tee /tmp/tf.log
          rc=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ $rc -ne 0 ]; then
            echo "::group::TERRAFORM ERROR"
            grep -A 40 "Error:" /tmp/tf.log || tail -80 /tmp/tf.log
            echo "::endgroup::"
          fi
          exit $rc
