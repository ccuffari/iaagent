name: Terraform dev
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Comando Terraform (dev)"
        required: true
        default: plan
        type: choice
        options: [init, validate, plan, apply, destroy]
# Serializza le run dello stesso ambiente: niente collisioni sul lock/lease dello state.
concurrency:
  group: terraform-dev
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    # Timeout esplicito: una operazione appesa fallisce con log, non viene uccisa muta.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: environments/dev
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_sql_admin_login: ${{ secrets.TF_VAR_sql_admin_login }}
      TF_VAR_sql_admin_password: ${{ secrets.TF_VAR_sql_admin_password }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false
      - run: terraform validate -no-color

      # PLAN: salvato su file e STAMPATO nei log, cosi' il piano e' sempre
      # ispezionabile (anche a run riuscita) e i destroy non passano inosservati.
      - name: Terraform plan
        if: ${{ inputs.command == 'plan' || inputs.command == 'apply' }}
        run: |
          terraform plan -input=false -out=tfplan -no-color
          echo "===== PIANO (terraform show) ====="
          terraform show -no-color tfplan

      # GUARDRAIL: se il piano distrugge risorse, l'apply si BLOCCA.
      # Un destroy non atteso e' quasi sempre un drift o un refactor di indirizzo.
      - name: Guardrail destroy
        if: ${{ inputs.command == 'apply' }}
        run: |
          DESTROYS=$(terraform show -json tfplan | jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length')
          echo "Risorse da distruggere nel piano: $DESTROYS"
          if [ "$DESTROYS" -gt 0 ]; then
            echo "::error::Il piano DISTRUGGE $DESTROYS risorse. Apply BLOCCATO."
            echo "::error::Verifica il piano (drift/refactor) prima di procedere."
            terraform show -no-color tfplan | grep -A2 'will be destroyed' || true
            exit 1
          fi
          echo "OK: nessun destroy nel piano."

      - name: Terraform apply
        if: ${{ inputs.command == 'apply' }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform init/validate/plan/destroy (comandi diretti)
        if: ${{ inputs.command == 'init' || inputs.command == 'validate' || inputs.command == 'destroy' }}
        run: terraform ${{ inputs.command }} -input=false ${{ inputs.command == 'destroy' && '-auto-approve' || '' }}
