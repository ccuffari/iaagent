name: Terraform dev apply
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Comando Terraform (dev)"
        required: true
        default: plan
        type: choice
        options: [init, validate, plan, apply, destroy]
permissions:
  contents: read
  id-token: write
jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: environments/dev
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_sql_admin_login: ${{ secrets.SQL_ADMIN_LOGIN }}
      TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
      TF_LOG: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: terraform init -input=false -no-color
      - name: Register resource providers (idempotente)
        if: ${{ inputs.command == 'apply' }}
        run: |
          set +e
          for NS in Microsoft.Purview; do
            echo "::group::register $NS"
            az provider register --namespace "$NS" --wait 2>&1 || echo "(registrazione $NS: esito non-zero, proseguo)"
            az provider show --namespace "$NS" --query "registrationState" -o tsv 2>&1 || true
            echo "::endgroup::"
          done
          exit 0
      - name: Import risorse esistenti (idempotente)
        if: ${{ inputs.command == 'apply' }}
        run: |
          set +e
          RG="rg-ai-dev-we-01"
          SUB="$ARM_SUBSCRIPTION_ID"
          BASE="/subscriptions/$SUB/resourceGroups/$RG/providers"
          IMPORTS="
            module.resource_group.azurerm_resource_group.this|/subscriptions/$SUB/resourceGroups/$RG
            module.virtual_network.azurerm_virtual_network.this|$BASE/Microsoft.Network/virtualNetworks/vnet-ai-dev-we-01
            module.virtual_network.azurerm_subnet.this|$BASE/Microsoft.Network/virtualNetworks/vnet-ai-dev-we-01/subnets/subnet-ai-dev-we-01
            module.storage_account.azurerm_storage_account.this|$BASE/Microsoft.Storage/storageAccounts/saaidevwe01
            module.data_factory.azurerm_data_factory.this|$BASE/Microsoft.DataFactory/factories/adf-ai-dev-we-01
            module.key_vault.azurerm_key_vault.this|$BASE/Microsoft.KeyVault/vaults/kv-ai-agent-dev-we-01
            module.log_analytics.azurerm_log_analytics_workspace.this|$BASE/Microsoft.OperationalInsights/workspaces/log-ai-dev-we-01
            module.sql_server.azurerm_mssql_server.this|$BASE/Microsoft.Sql/servers/sql-ai-dev-we-01
            module.sql_database.azurerm_mssql_database.this|$BASE/Microsoft.Sql/servers/sql-ai-dev-we-01/databases/sql-db-ai-dev-we-01
            module.budget.azurerm_consumption_budget_resource_group.this|$BASE/Microsoft.Consumption/budgets/budget-ai-dev-we-01
            module.diag_storage_account.azurerm_monitor_diagnostic_setting.this|$BASE/Microsoft.Storage/storageAccounts/saaidevwe01|diag-storage-account
            module.diag_adf.azurerm_monitor_diagnostic_setting.this|$BASE/Microsoft.DataFactory/factories/adf-ai-dev-we-01|diag-adf
            module.diag_key_vault.azurerm_monitor_diagnostic_setting.this|$BASE/Microsoft.KeyVault/vaults/kv-ai-agent-dev-we-01|diag-keyvault
            module.diag_sql_server.azurerm_monitor_diagnostic_setting.this|$BASE/Microsoft.Sql/servers/sql-ai-dev-we-01|diag-sqlserver
            module.diag_sql_database.azurerm_monitor_diagnostic_setting.this|$BASE/Microsoft.Sql/servers/sql-ai-dev-we-01/databases/sql-db-ai-dev-we-01|diag-sqldb
          "
          echo "$IMPORTS" | while IFS='|' read -r ADDR ID; do
            [ -z "$ADDR" ] && continue
            echo "::group::import $ADDR"
            terraform import -input=false -no-color -lock=false "$ADDR" "$ID" 2>&1 || echo "(import saltato: gia' nello state o non presente)"
            echo "::endgroup::"
          done
          exit 0
      - name: Terraform ${{ inputs.command }}
        run: |
          set +e
          CMD="${{ inputs.command }}"
          EXTRA=""
          if [ "$CMD" = "apply" ] || [ "$CMD" = "destroy" ]; then
            EXTRA="-auto-approve"
          fi
          echo "::group::terraform $CMD"
          terraform $CMD -input=false -no-color -compact-warnings $EXTRA 2>&1 | tee /tmp/tf.log
          rc=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ $rc -ne 0 ]; then
            echo "::group::TERRAFORM ERROR"
            grep -A 40 "Error:" /tmp/tf.log || tail -80 /tmp/tf.log
            echo "::endgroup::"
          fi
          exit $rc
