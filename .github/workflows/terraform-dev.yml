name: Terraform dev apply
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Comando Terraform (dev)"
        required: true
        default: plan
        type: choice
        options: [init, validate, plan, apply, destroy, state-list]
permissions:
  contents: write
  id-token: write
jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: environments/dev
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_sql_admin_login: ${{ secrets.SQL_ADMIN_LOGIN }}
      TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
      TF_LOG: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: |
          echo "::group::terraform init"
          terraform init -input=false -no-color
          echo "::endgroup::"
      - name: Terraform state list (scrive su file)
        if: ${{ inputs.command == 'state-list' || inputs.command == 'plan' }}
        run: |
          echo "::group::terraform state list"
          terraform state list -no-color > ../../state-list.txt 2>&1 || echo "(state list fallito)" > ../../state-list.txt
          cat ../../state-list.txt
          echo "::endgroup::"
      - name: Commit state-list.txt
        if: ${{ inputs.command == 'state-list' || inputs.command == 'plan' }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state-list.txt
          git commit -m "ci: aggiorna state-list.txt [skip ci]" || echo "(nessuna modifica)"
          git push || echo "(push saltato)"
      - name: Import mirato diagnostic settings esistenti
        if: ${{ inputs.command == 'apply' }}
        run: |
          set +e
          RG="rg-ai-dev-we-01"
          SUB="$ARM_SUBSCRIPTION_ID"
          BASE="/subscriptions/$SUB/resourceGroups/$RG/providers"
          # Importa SOLO le risorse che esistono su Azure ma non sono nello state.
          # Formato: indirizzo_terraform|id_azure
          IMPORTS="
            module.diag_key_vault.azurerm_monitor_diagnostic_setting.this|$BASE/Microsoft.KeyVault/vaults/kv-ai-agent-dev-we-01|diag-keyvault
            module.diag_sql_server.azurerm_monitor_diagnostic_setting.this|$BASE/Microsoft.Sql/servers/sql-ai-dev-we-01|diag-sqlserver
          "
          echo "$IMPORTS" | while IFS='|' read -r ADDR ID; do
            [ -z "$ADDR" ] && continue
            echo "::group::import $ADDR"
            terraform import -input=false -no-color -lock=false "$ADDR" "$ID" 2>&1 || echo "(import saltato: gia' nello state o non presente)"
            echo "::endgroup::"
          done
          exit 0
      - name: Terraform ${{ inputs.command }}
        if: ${{ inputs.command != 'state-list' }}
        run: |
          set +e
          CMD="${{ inputs.command }}"
          EXTRA=""
          if [ "$CMD" = "apply" ] || [ "$CMD" = "destroy" ]; then
            EXTRA="-auto-approve"
          fi
          echo "::group::terraform $CMD (lock=false)"
          echo "Comando: terraform $CMD -input=false -no-color -compact-warnings -lock=false $EXTRA"
          terraform $CMD -input=false -no-color -compact-warnings -lock=false $EXTRA 2>&1 | tee /tmp/tf.log
          rc=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ $rc -ne 0 ]; then
            echo "::group::TERRAFORM ERROR"
            grep -A 40 "Error:" /tmp/tf.log || tail -80 /tmp/tf.log
            echo "::endgroup::"
          fi
          exit $rc
