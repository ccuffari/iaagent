name: Terraform dev
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Comando Terraform (dev)"
        required: true
        default: plan
        type: choice
        options: [init, validate, plan, apply, destroy]
permissions:
  contents: read
  id-token: write
jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: environments/dev
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_subscription_id: ${{ secrets.TF_VAR_subscription_id }}
      TF_VAR_tenant_id: ${{ secrets.TF_VAR_tenant_id }}
      TF_VAR_resource_group_name: ${{ secrets.TF_VAR_resource_group_name }}
      TF_VAR_storage_account_name: ${{ secrets.TF_VAR_storage_account_name }}
      TF_VAR_key_vault_name: ${{ secrets.TF_VAR_key_vault_name }}
      TF_VAR_data_factory_name: ${{ secrets.TF_VAR_data_factory_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ secrets.TF_VAR_resource_group_name }}" \
            -backend-config="storage_account_name=${{ secrets.TF_VAR_storage_account_name }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=dev.terraform.tfstate"
      - run: terraform ${{ inputs.command }} -input=false ${{ (inputs.command == 'apply' || inputs.command == 'destroy') && '-auto-approve' || '' }}
