name: Terraform bootstrap (state backend)

# Pipeline di BOOTSTRAP: crea una tantum il backend remoto dello state Terraform.
# Ha gia' fatto il suo lavoro (lo storage di state esiste).
#
# FUORI DAL FLUSSO AUTOMATICO: nessun trigger su push/PR. Parte SOLO se lanciata
# manualmente da Actions -> 'Terraform bootstrap (state backend)' -> Run workflow.
# In alternativa puo' essere disattivata del tutto da GitHub.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bootstrap
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false
      - run: terraform validate -no-color
      - run: terraform plan -input=false -no-color
