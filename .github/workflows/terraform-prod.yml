name: Terraform prod
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Comando Terraform (prod)"
        required: true
        default: plan
        type: choice
        options: [init, validate, plan, apply, destroy]
# Serializza le run dello stesso ambiente: niente collisioni sul lock/lease dello state.
concurrency:
  group: terraform-prod
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: prod
    # Timeout esplicito: una operazione appesa fallisce con log, non viene uccisa muta.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: environments/prod
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Azure login (per az CLI)
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'
      - name: Ensure state container exists
        run: |
          az storage container create \
            --name tfstate \
            --account-name sttfstateprodwe02 \
            --auth-mode login || true
      - run: terraform init -input=false
      - run: terraform validate -no-color
      - run: terraform ${{ inputs.command }} -input=false ${{ (inputs.command == 'apply' || inputs.command == 'destroy') && '-auto-approve' || '' }}
