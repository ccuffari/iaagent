name: AZ delete resource (cleanup)

# Pipeline di CLEANUP manuale: elimina un resource group da Azure SOLO se il suo
# nome NON compare nel codice Terraform del repo. Se il RG e' censito in .tf/.tfvars
# la pipeline ABORTA: in quel caso la risorsa va gestita via Terraform (destroy),
# non cancellata a mano (altrimenti si crea drift tra codice e Azure).
#
# Uso: Actions -> 'AZ delete resource (cleanup)' -> Run workflow
#   - resource_group: nome del RG da eliminare
#   - confirm: digitare esattamente DELETE per confermare

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: "Nome del resource group da eliminare"
        required: true
        type: string
      confirm:
        description: "Digita DELETE per confermare l'eliminazione"
        required: true
        type: string

concurrency:
  group: az-delete-resource
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  guardrail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verifica conferma
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE" ]; then
            echo "::error::Conferma non valida. Digita esattamente DELETE nell'input 'confirm'."
            exit 1
          fi

      - name: Guardrail - il RG e' censito nel codice Terraform?
        id: guardrail
        run: |
          RG="${{ inputs.resource_group }}"
          echo "Cerco '$RG' nei file Terraform del repo..."
          # Cerca il nome del RG in tutti i .tf e .tfvars (esclusi i workflow).
          MATCHES=$(grep -rn --include='*.tf' --include='*.tfvars' -F "$RG" . || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Il resource group '$RG' E' CENSITO nel codice Terraform. La pipeline ABORTA."
            echo "::error::Gestisci questa risorsa via Terraform (destroy), non con la cancellazione manuale."
            echo "--- Occorrenze trovate ---"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK: '$RG' non e' censito nel codice Terraform. Procedo con l'eliminazione."

  delete:
    needs: guardrail
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}"
            }

      - name: Elimina resource group
        run: |
          RG="${{ inputs.resource_group }}"
          echo "Elimino il resource group '$RG'..."
          az group delete --name "$RG" --yes --no-wait
          echo "Comando inviato. L'eliminazione avviene in background (--no-wait)."
          echo "Verifica con: az group show --name $RG"
